name: Build bot.exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest pyinstaller
      - run: python -m pytest tests
      - run: pyinstaller --onefile --name bot bot.py
      - name: Package
        shell: bash
        run: |
          mkdir dist/bot-reseaux-sociaux
          cp dist/bot.exe config.example.yaml README.md dist/bot-reseaux-sociaux/
          cd dist && 7z a ../bot-reseaux-sociaux.zip bot-reseaux-sociaux
      - uses: actions/upload-artifact@v4
        with:
          name: bot-reseaux-sociaux
          path: bot-reseaux-sociaux.zip
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bot-reseaux-sociaux.zip
